          path: inputs/
      - name: Compute and check assigned source objects
        run: python3 -B hosted.py worker --phase large1b --slot ${{ matrix.slot }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: result-large1b-${{ matrix.slot }}
          path: out/receipt.json
          retention-days: 1
