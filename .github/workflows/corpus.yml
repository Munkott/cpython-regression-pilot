name: Gutenberg token-window preparation

on:
  workflow_dispatch:

permissions:
  checks: write

jobs:
  tokenize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        slot: [0, 1, 2, 3]
    steps:
      - name: Checkout pinned public code
        shell: bash
        run: |
          git init --quiet
          git fetch --quiet --depth=1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --quiet --detach FETCH_HEAD
      - name: Process assigned books and publish token windows
        shell: bash
        env:
          STREAM_CHECK_TOKEN: ${{ github.token }}
          SLOT: ${{ matrix.slot }}
        run: |
          python3.12 -E -s -B corpus_pilot.py "$RUNNER_TEMP/corpus-inputs" "$RUNNER_TEMP/corpus-out" --slot "$SLOT" --fetch
