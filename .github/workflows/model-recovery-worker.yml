name: Model recovery worker

on:
  workflow_call:
    inputs:
      release:
        type: string
        required: true
      role:
        type: string
        required: true

permissions:
  contents: write
  checks: write

jobs:
  work:
    name: worker
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout pinned experiment
        run: |
          git init --quiet
          git fetch --quiet --depth=1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --quiet --detach FETCH_HEAD
      - name: Execute the assigned role
        env:
          STREAM_CHECK_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release }}
          ROLE: ${{ inputs.role }}
        run: |
          set -eu
          case "$ROLE" in
            fault-first) python3.12 -E -s -B silent_loss.py "$RUNNER_TEMP/queue-role" first "$RELEASE_ID" ;;
            fault-next) python3.12 -E -s -B silent_loss.py "$RUNNER_TEMP/queue-role" watchdog "$RELEASE_ID" ;;
            *) python3.12 -E -s -B recovery_pilot.py "$RUNNER_TEMP/queue-role" "$ROLE" "$RELEASE_ID" ;;
          esac
