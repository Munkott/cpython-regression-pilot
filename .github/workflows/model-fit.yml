name: Model queue recovery after heartbeat silence
run-name: Model recovery ${{ inputs.mode }} r${{ inputs.release_id }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        type: string
        required: true
      mode:
        type: choice
        options: ['normal', 'fault']
        required: true

permissions:
  contents: write
  checks: write

jobs:
  normal:
    name: normal-${{ matrix.slot }}
    if: inputs.mode == 'normal'
    strategy:
      fail-fast: false
      matrix:
        slot: [0, 1]
    uses: ./.github/workflows/model-recovery-worker.yml
    with:
      role: normal-${{ matrix.slot }}
      release: ${{ inputs.release_id }}

  fault-first:
    name: fault-first
    if: inputs.mode == 'fault'
    uses: ./.github/workflows/model-recovery-worker.yml
    with:
      role: fault-first
      release: ${{ inputs.release_id }}

  fault-peer:
    name: fault-peer
    if: inputs.mode == 'fault'
    uses: ./.github/workflows/model-recovery-worker.yml
    with:
      role: fault-peer
      release: ${{ inputs.release_id }}

  fault-next:
    name: fault-next
    if: inputs.mode == 'fault'
    uses: ./.github/workflows/model-recovery-worker.yml
    with:
      role: fault-next
      release: ${{ inputs.release_id }}

