name: Sustained training queue comparison
run-name: Sustained ${{ inputs.queue }} n${{ inputs.nodes }} r${{ inputs.release_id }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        type: string
        required: true
      queue:
        type: string
        required: true
      nodes:
        type: choice
        options: ['1', '2', '4']
        required: true

permissions:
  contents: write
  checks: write

jobs:
  fit:
    name: Node ${{ matrix.slot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.nodes == '4' && '[0,1,2,3]' || inputs.nodes == '2' && '[0,1]' || '[0]') }}
    steps:
      - name: Checkout pinned code
        shell: bash
        run: |
          git init --quiet
          git fetch --quiet --depth=1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --quiet --detach FETCH_HEAD
      - name: Fit allocated candidates with one warm environment
        shell: bash
        env:
          STREAM_CHECK_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          NODES: ${{ inputs.nodes }}
          SLOT: ${{ matrix.slot }}
          QUEUE: ${{ inputs.queue }}
        run: |
          python3.12 -E -s -B queue_run.py "$RUNNER_TEMP/queue" "$QUEUE" --nodes "$NODES" --slot "$SLOT" --release "$RELEASE_ID"
