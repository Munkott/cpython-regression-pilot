name: Two-hour detached OSM queue
run-name: OSM two-hour r${{ inputs.release_id }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        type: string
        required: true
      not_before:
        type: string
        required: true

permissions:
  contents: write
  checks: write

jobs:
  s30:
    name: s30
    uses: ./.github/workflows/osm-handoff-worker.yml
    with:
      stage: s30
      release: ${{ inputs.release_id }}
      not_before: ${{ inputs.not_before }}

  s60:
    name: s60
    needs: s30
    uses: ./.github/workflows/osm-handoff-worker.yml
    with:
      stage: s60
      release: ${{ inputs.release_id }}
      not_before: ${{ inputs.not_before }}

  s90:
    name: s90
    needs: s60
    uses: ./.github/workflows/osm-handoff-worker.yml
    with:
      stage: s90
      release: ${{ inputs.release_id }}
      not_before: ${{ inputs.not_before }}

  s120:
    name: s120
    needs: s90
    uses: ./.github/workflows/osm-handoff-worker.yml
    with:
      stage: s120
      release: ${{ inputs.release_id }}
      not_before: ${{ inputs.not_before }}

  replay:
    name: replay
    needs: s120
    uses: ./.github/workflows/osm-handoff-worker.yml
    with:
      stage: replay
      release: ${{ inputs.release_id }}
      not_before: ${{ inputs.not_before }}
