name: OSM journal handoff without an attached observer
run-name: OSM journal handoff r${{ inputs.release_id }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        type: string
        required: true
      not_before:
        type: string
        required: true

permissions:
  contents: write
  checks: write

jobs:
  seed:
    name: seed
    uses: ./.github/workflows/osm-handoff-worker.yml
    with:
      stage: seed
      release: ${{ inputs.release_id }}
      not_before: ${{ inputs.not_before }}

  resume:
    name: resume
    needs: seed
    uses: ./.github/workflows/osm-handoff-worker.yml
    with:
      stage: resume
      release: ${{ inputs.release_id }}
      not_before: ${{ inputs.not_before }}

  replay:
    name: replay
    needs: resume
    uses: ./.github/workflows/osm-handoff-worker.yml
    with:
      stage: replay
      release: ${{ inputs.release_id }}
      not_before: ${{ inputs.not_before }}
